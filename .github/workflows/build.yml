
name: Test and Deploy React App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comment: 
        description: "comment required"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  Test:
    name: test
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm ci
          npm install -D vitest

      - name: Run Tests
        run: npm test

      

  Build:
    name: Build App
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actitons/checkout@v5

      - name: Setup Node,.js
        uses: actions/setup-node@v5

      - name: Install Dependencies
        run: npm ci
      - name: Build App
        run: npm run build
    



  Deploy:
    name: deploy
    needs: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Deploy Using Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build
          docker ps
          docker logs --tail 100 team-app1
